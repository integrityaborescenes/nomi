[package]
name = "nomi"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nomi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
regex = "1"
once_cell = "1"
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
rand = "0.8"

# Зависимости (включая candle и его матричную алгебру) собираются с -O3 даже в dev-mode.
# Без этого candle компилится debug-сборкой, что в 5-20× медленнее на матричных операциях.
# Сам код nomi остаётся debug — быстрая итерация при разработке.
[profile.dev.package."*"]
opt-level = 3

